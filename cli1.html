<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时麦克风音频流式传输</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 2.2rem;
            color: #fdbb2d;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .card-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #fdbb2d;
            display: flex;
            align-items: center;
        }
        
        .card-title i {
            margin-right: 10px;
            font-size: 1.5rem;
        }
        
        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 600px) {
            .settings {
                grid-template-columns: 1fr;
            }
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #fdbb2d;
            box-shadow: 0 0 0 2px rgba(253, 187, 45, 0.3);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }
        
        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        button i {
            margin-right: 8px;
        }
        
        #connectBtn {
            background: #3498db;
            color: white;
        }
        
        #connectBtn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        #startStreamBtn {
            background: #2ecc71;
            color: white;
        }
        
        #startStreamBtn:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }
        
        #stopStreamBtn {
            background: #e74c3c;
            color: white;
        }
        
        #stopStreamBtn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .status-item {
            flex: 1;
            min-width: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .status-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fdbb2d;
        }
        
        .audio-visualization {
            height: 150px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        
        .result-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
        }
        
        .result-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #fdbb2d;
            display: flex;
            align-items: center;
        }
        
        .result-content {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
        
        .progress-container {
            margin-top: 20px;
        }
        
        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: #2ecc71;
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.9rem;
        }
        
        .log-container {
            margin-top: 25px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .success {
            color: #2ecc71;
        }
        
        .error {
            color: #e74c3c;
        }
        
        .info {
            color: #3498db;
        }
        
        .warning {
            color: #f39c12;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 15px;
        }
        
        .status-connected {
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }
        
        .status-disconnected {
            background: #e74c3c;
        }
        
        .status-connecting {
            background: #f39c12;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .mic-icon {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 36px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 auto 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .mic-icon.active {
            background: rgba(231, 76, 60, 0.3);
            animation: pulse 1s infinite;
        }
        
        .mic-icon.active::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(231, 76, 60, 0.5);
            border-radius: 50%;
            animation: ripple 1.5s infinite;
        }
        
        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        .vumeter {
            display: flex;
            align-items: flex-end;
            height: 100%;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
        }
        
        .vumeter-bar {
            width: 100%;
            background: linear-gradient(to top, #2ecc71, #f39c12, #e74c3c);
            transition: height 0.05s;
        }
        
        .timer-display {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fdbb2d;
        }
        
        .signal-meter {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 100%;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
        }
        
        .signal-bar {
            flex: 1;
            background: #3498db;
            border-radius: 3px 3px 0 0;
            height: 0%;
            transition: height 0.05s;
        }
        
        .json-preview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
        }
        
        .user-info {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .user-info input {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-microphone-alt"></i> 实时麦克风音频流式传输</h1>
        
        <div class="connection-status">
            <div class="status-indicator status-disconnected" id="statusIndicator"></div>
            <div id="connectionStatus">未连接</div>
        </div>
        
        <div class="card">
            <div class="card-title"><i class="fas fa-cog"></i> 服务器设置</div>
            <div class="settings">
                <div class="form-group">
                    <label for="serverUrl"><i class="fas fa-link"></i> WebSocket 服务器地址</label>
                    <input type="text" id="serverUrl" value="ws://192.168.31.252:8765/ws/audio" placeholder="输入WebSocket服务器地址">
                </div>
                
                <div class="form-group">
                    <label for="chunkSize"><i class="fas fa-chart-bar"></i> 数据块大小 (字节)</label>
                    <select id="chunkSize">
                        <option value="1024">1024</option>
                        <option value="2048" selected>2048</option>
                        <option value="4096">4096</option>
                        <option value="8192">8192</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title"><i class="fas fa-user"></i> 用户信息</div>
            <div class="user-info">
                <div class="form-group">
                    <label for="userId"><i class="fas fa-user-tag"></i> 用户ID</label>
                    <input type="text" id="userId" placeholder="输入用户ID">
                </div>
                <div class="form-group">
                    <label for="deviceId"><i class="fas fa-microchip"></i> 设备ID</label>
                    <input type="text" id="deviceId" placeholder="输入设备ID">
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title"><i class="fas fa-microphone"></i> 麦克风状态</div>
            <div class="mic-icon" id="micIcon">
                <i class="fas fa-microphone"></i>
            </div>
            <div class="timer-display" id="timerDisplay">00:00</div>
        </div>
        
        <div class="audio-visualization">
            <div class="vumeter">
                <div class="vumeter-bar" id="vumeterBar"></div>
            </div>
            <div class="signal-meter" id="signalMeter"></div>
        </div>
        
        <div class="controls">
            <button id="connectBtn"><i class="fas fa-plug"></i> 连接服务器</button>
            <button id="startStreamBtn"><i class="fas fa-microphone-alt"></i> 开始传输</button>
            <button id="stopStreamBtn" disabled><i class="fas fa-microphone-slash"></i> 停止传输</button>
        </div>
        
        <div class="status">
            <div class="status-item">
                <div class="status-label">连接状态</div>
                <div class="status-value" id="connectionStatusValue">未连接</div>
            </div>
            <div class="status-item">
                <div class="status-label">已发送</div>
                <div class="status-value" id="sentBytes">0 B</div>
            </div>
            <div class="status-item">
                <div class="status-label">采样率</div>
                <div class="status-value" id="sampleRate">-</div>
            </div>
            <div class="status-item">
                <div class="status-label">传输状态</div>
                <div class="status-value" id="streamStatus">未激活</div>
            </div>
        </div>
        
        <div class="result-container">
            <div class="result-title"><i class="fas fa-server"></i> 服务器响应</div>
            <div class="result-content" id="serverResponse">等待服务器响应...</div>
        </div>
        
        <div class="card">
            <div class="card-title"><i class="fas fa-code"></i> JSON数据预览</div>
            <div class="json-preview" id="jsonPreview">{"status":"","device_id":"","user_id":"","id":"","image":"","audio":"","start_time":"","end_time":"","sample_rate":"","bit_depth":"","format":""}</div>
        </div>
        
        <div class="log-container" id="logContainer">
            <div class="log-entry info">系统已就绪，请获取麦克风权限并连接服务器</div>
        </div>
    </div>

    <script>
        // 全局变量
        let websocket = null;
        let isStreaming = false;
        let isMicActive = false;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let soundMeter = null;
        let sourceSampleRate = 44100;
        let packetCounter = 0;
        let sentBytes = 0;
        let startTime = null;
        let timerInterval = null;
        let sessionUUID = null;
        let sessionStartTimestamp = null;
        let accumulatedTime = 0;
        
        // DOM元素
        const connectBtn = document.getElementById('connectBtn');
        const startStreamBtn = document.getElementById('startStreamBtn');
        const stopStreamBtn = document.getElementById('stopStreamBtn');
        const serverUrlInput = document.getElementById('serverUrl');
        const chunkSizeSelect = document.getElementById('chunkSize');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionStatusValue = document.getElementById('connectionStatusValue');
        const sentBytesEl = document.getElementById('sentBytes');
        const serverResponse = document.getElementById('serverResponse');
        const logContainer = document.getElementById('logContainer');
        const statusIndicator = document.getElementById('statusIndicator');
        const progressBar = document.getElementById('progressBar');
        const micIcon = document.getElementById('micIcon');
        const vumeterBar = document.getElementById('vumeterBar');
        const timerDisplay = document.getElementById('timerDisplay');
        const streamStatus = document.getElementById('streamStatus');
        const sampleRateEl = document.getElementById('sampleRate');
        const signalMeter = document.getElementById('signalMeter');
        const jsonPreview = document.getElementById('jsonPreview');
        const userIdInput = document.getElementById('userId');
        const deviceIdInput = document.getElementById('deviceId');
        
        // 初始化可视化条
        function initSignalMeter() {
            signalMeter.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const bar = document.createElement('div');
                bar.className = 'signal-bar';
                bar.style.height = '0%';
                signalMeter.appendChild(bar);
            }
        }
        
        // 更新信号强度指示器
        function updateSignalMeter(volume) {
            const bars = signalMeter.querySelectorAll('.signal-bar');
            const barCount = bars.length;
            const activeBars = Math.round(volume * barCount);
            
            bars.forEach((bar, index) => {
                if (index < activeBars) {
                    const height = (index / barCount) * 100 + 10;
                    bar.style.height = `${height}%`;
                    bar.style.background = index > barCount * 0.7 ? 
                        'linear-gradient(to top, #f39c12, #e74c3c)' : 
                        index > barCount * 0.4 ? 
                        'linear-gradient(to top, #2ecc71, #f39c12)' : 
                        'linear-gradient(to top, #3498db, #2ecc71)';
                } else {
                    bar.style.height = '0%';
                }
            });
        }
        
        // 生成UUID
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        // 初始化
        function init() {
            // 按钮事件
            connectBtn.addEventListener('click', toggleConnection);
            startStreamBtn.addEventListener('click', toggleStreaming);
            stopStreamBtn.addEventListener('click', stopStreaming);
            
            // 设置选择器事件
            chunkSizeSelect.addEventListener('change', () => {
                updateChunkSize(parseInt(chunkSizeSelect.value));
                addLog(`数据块大小设置为: ${chunkSizeSelect.value} 字节`, 'info');
            });
            
            // 初始化可视化
            initSignalMeter();
            
            // 自动生成设备ID
            const deviceId = localStorage.getItem('device_id') || generateUUID();
            deviceIdInput.value = deviceId;
            localStorage.setItem('device_id', deviceId);
            
            addLog('应用程序初始化完成，准备进行实时音频传输', 'info');
        }
        
        // 更新数据块大小
        function updateChunkSize(size) {
            chunkSize = size;
        }
        
        // 开始录音
        async function startRecording() {
            if (isMicActive) return;
            
            try {
                addLog('正在获取麦克风权限...', 'info');
                
                // 请求麦克风权限
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        sampleRate: 44100,
                        channelCount: 1,
                        echoCancellation: false,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });
                
                // 创建音频上下文
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sourceSampleRate = audioContext.sampleRate;
                sampleRateEl.textContent = `${(sourceSampleRate/1000).toFixed(1)} kHz`;
                
                // 初始化音量计
                initSoundMeter();
                
                // 更新状态
                isMicActive = true;
                micIcon.classList.add('active');
                startStreamBtn.disabled = false;
                streamStatus.textContent = '就绪';
                
                addLog(`麦克风已启用，采样率: ${sourceSampleRate}Hz`, 'success');
                addLog('点击"开始传输"按钮开始流式传输音频', 'info');
                
            } catch (error) {
                addLog(`获取麦克风权限失败: ${error.message}`, 'error');
                micIcon.classList.remove('active');
                startStreamBtn.disabled = true;
            }
        }
        
        // 初始化音量计
        function initSoundMeter() {
            // 清理旧资源
            if (soundMeter) {
                soundMeter.stop();
                soundMeter = null;
            }
            
            // 创建新的音量计
            soundMeter = new SoundMeter(audioContext);
            soundMeter.connectToSource(mediaStream, function(e) {
                if (e) {
                    addLog(`初始化音频监控失败: ${e.message}`, 'error');
                    return;
                }
                
                // 启动音量计更新循环
                let frameId;
                const checkVolume = () => {
                    const volume = Math.min(1, Math.max(0, soundMeter.instant.toFixed(2)));
                    vumeterBar.style.height = `${volume * 100}%`;
                    updateSignalMeter(volume);
                    
                    if (isMicActive) {
                        frameId = requestAnimationFrame(checkVolume);
                    } else {
                        cancelAnimationFrame(frameId);
                    }
                };
                
                requestAnimationFrame(checkVolume);
            });
        }
        
        // 启动音频处理
        function startAudioProcessing() {
            if (!mediaStream || !audioContext) return;
            
            // 创建媒体流源
            const source = audioContext.createMediaStreamSource(mediaStream);
            
            // 创建脚本处理器
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            source.connect(processor);
            processor.connect(audioContext.destination);
            
            // 重置计数器
            packetCounter = 0;
            sentBytes = 0;
            sentBytesEl.textContent = '0 B';
            accumulatedTime = 0;
            
            // 生成会话UUID和时间戳
            sessionUUID = generateUUID();
            sessionStartTimestamp = Date.now();
            
            // 设置处理回调
            processor.onaudioprocess = (event) => {
                if (!isStreaming) return;
                
                // 获取输入音频数据
                const inputBuffer = event.inputBuffer;
                const inputData = inputBuffer.getChannelData(0);
                
                // 转换为目标格式 (16kHz, 16bit PCM)
                const outputData = processAudioData(inputData, sourceSampleRate);
                
                // 计算数据块时长（毫秒）
                const chunkDuration = (outputData.length / 16000) * 1000;
                
                // 更新时间戳
                const start_time = accumulatedTime;
                const end_time = accumulatedTime + chunkDuration;
                accumulatedTime = end_time;
                
                // 将音频数据转换为Base64字符串
                const base64Audio = arrayBufferToBase64(outputData.buffer);
                
                // 构造VoiceData对象
                const voiceData = {
                    status: "streaming",
                    device_id: deviceIdInput.value || "unknown",
                    user_id: userIdInput.value || "anonymous",
                    id: sessionUUID,
                    image: "",
                    audio: base64Audio,
                    start_time: start_time.toString(),
                    end_time: end_time.toString(),
                    sample_rate: "16000",
                    bit_depth: "16",
                    format: "PCM"
                };
                
                // 更新JSON预览
                updateJsonPreview(voiceData);
                
                // 发送JSON数据
                websocket.send(JSON.stringify(voiceData));
                
                // 更新统计数据
                sentBytes += JSON.stringify(voiceData).length;
                packetCounter++;
                sentBytesEl.textContent = formatFileSize(sentBytes);
            };
            
            addLog('音频处理引擎已启动，开始流式传输', 'success');
        }
        
        // 更新JSON预览
        function updateJsonPreview(voiceData) {
            const preview = {
                status: voiceData.status,
                device_id: voiceData.device_id,
                user_id: voiceData.user_id,
                id: voiceData.id,
                image: voiceData.image ? "Base64 image data..." : "",
                audio: voiceData.audio.substring(0, 30) + "...",
                start_time: voiceData.start_time,
                end_time: voiceData.end_time,
                sample_rate: voiceData.sample_rate,
                bit_depth: voiceData.bit_depth,
                format: voiceData.format
            };
            jsonPreview.textContent = JSON.stringify(preview, null, 2);
        }
        
        // ArrayBuffer转Base64
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }
        
        // 处理音频数据 - 下采样到16kHz并转换为16位PCM
        function processAudioData(inputData, sourceSampleRate) {
            // 目标采样率
            const targetSampleRate = 16000;
            
            // 计算采样比例
            const sampleRatio = sourceSampleRate / targetSampleRate;
            const newLength = Math.round(inputData.length / sampleRatio);
            const output = new Int16Array(newLength);
            
            // 简单下采样（可以改进为带抗混叠滤波的重采样）
            for (let i = 0; i < newLength; i++) {
                const index = Math.round(i * sampleRatio);
                if (index < inputData.length) {
                    // 转换为16位范围（-32768到32767）
                    let sample = inputData[index] * 0x7FFF;
                    // 限制在16位范围内
                    sample = Math.max(-0x8000, Math.min(0x7FFF, sample));
                    output[i] = Math.round(sample);
                }
            }
            
            return output;
        }
        
        // 开始计时器
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const seconds = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(seconds / 60);
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        // 停止计时器
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerDisplay.textContent = '00:00';
        }
        
        // 切换连接状态
        function toggleConnection() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                disconnect();
            } else {
                connect();
            }
        }
        
        // 连接到服务器
        function connect() {
            const url = serverUrlInput.value.trim();
            
            if (!url) {
                addLog('错误：请输入WebSocket服务器地址', 'error');
                return;
            }
            
            addLog(`正在连接到服务器: ${url}`, 'info');
            updateConnectionStatus('connecting', '连接中...');
            
            try {
                websocket = new WebSocket(url);
                
                websocket.onopen = () => {
                    updateConnectionStatus('connected', '已连接');
                    addLog('成功连接到服务器', 'success');
                    
                    // 启动麦克风获取（如果尚未获取）
                    if (!isMicActive) {
                        startRecording();
                    } else {
                        startStreamBtn.disabled = false;
                    }
                };
                
                websocket.onclose = () => {
                    updateConnectionStatus('disconnected', '已断开');
                    addLog('服务器连接已关闭', 'warning');
                    
                    // 如果正在传输，停止传输
                    if (isStreaming) {
                        stopStreaming();
                    }
                };
                
                websocket.onerror = (error) => {
                    updateConnectionStatus('error', '连接错误');
                    addLog(`WebSocket错误: ${error}`, 'error');
                };
                
                websocket.onmessage = (event) => {
                    try {
                        let response;
                        
                        // 处理不同类型的消息
                        if (typeof event.data === 'string') {
                            response = event.data;
                        } else if (event.data instanceof ArrayBuffer) {
                            // 对于二进制数据，假设是文本响应
                            const decoder = new TextDecoder('utf-8');
                            response = decoder.decode(event.data);
                        } else if (event.data instanceof Blob) {
                            // Blob消息
                            const reader = new FileReader();
                            reader.onload = () => {
                                serverResponse.textContent = reader.result;
                                addLog(`收到服务器响应: ${reader.result}`, 'info');
                            };
                            reader.readAsText(event.data);
                            return;
                        } else {
                            response = JSON.stringify(event.data);
                        }
                        
                        serverResponse.textContent = response;
                        addLog(`收到服务器响应: ${response}`, 'info');
                    } catch (e) {
                        addLog(`处理服务器响应时出错: ${e.message}`, 'error');
                    }
                };
                
            } catch (error) {
                updateConnectionStatus('error', '连接失败');
                addLog(`连接失败: ${error.message}`, 'error');
            }
        }
        
        // 断开连接
        function disconnect() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.close(1000, '用户断开连接');
            }
        }
        
        // 切换流传输状态
        function toggleStreaming() {
            if (isStreaming) {
                stopStreaming();
            } else {
                startStreaming();
            }
        }
        
        // 开始流传输
        function startStreaming() {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) {
                addLog('错误：未连接到服务器', 'error');
                return;
            }
            
            if (!isMicActive) {
                addLog('错误：麦克风未激活', 'error');
                return;
            }
            
            // 更新状态
            isStreaming = true;
            startStreamBtn.disabled = true;
            stopStreamBtn.disabled = false;
            streamStatus.textContent = '传输中...';
            streamStatus.style.color = '#2ecc71';
            
            // 启动音频处理
            startAudioProcessing();
            
            // 启动计时器
            startTimer();
            
            addLog('开始实时音频流传输', 'success');
        }
        
        // 停止流传输
        function stopStreaming() {
            if (isStreaming) {
                isStreaming = false;
                
                // 清理处理器
                if (processor) {
                    processor.disconnect();
                    processor = null;
                }
                
                // 发送结束消息
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    const endMessage = {
                        status: "completed",
                        device_id: deviceIdInput.value || "unknown",
                        user_id: userIdInput.value || "anonymous",
                        id: sessionUUID,
                        image: "",
                        audio: "",
                        start_time: "0",
                        end_time: accumulatedTime.toString(),
                        sample_rate: "16000",
                        bit_depth: "16",
                        format: "PCM"
                    };
                    websocket.send(JSON.stringify(endMessage));
                    addLog('发送结束消息', 'info');
                }
                
                // 更新UI
                startStreamBtn.disabled = false;
                stopStreamBtn.disabled = true;
                streamStatus.textContent = '已停止';
                streamStatus.style.color = '#e74c3c';
                
                // 停止计时器
                stopTimer();
                
                addLog('音频流传输已停止', 'info');
            }
        }
        
        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            else return (bytes / 1048576).toFixed(1) + ' MB';
        }
        
        // 添加日志
        function addLog(message, type = 'info') {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // 更新连接状态
        function updateConnectionStatus(status, text) {
            connectionStatus.textContent = text;
            connectionStatusValue.textContent = text;
            
            // 重置所有状态类
            statusIndicator.className = 'status-indicator';
            
            // 添加当前状态类
            switch (status) {
                case 'connected':
                    statusIndicator.classList.add('status-connected');
                    connectBtn.textContent = '断开连接';
                    connectBtn.style.backgroundColor = '#e74c3c';
                    break;
                case 'disconnected':
                    statusIndicator.classList.add('status-disconnected');
                    connectBtn.textContent = '连接服务器';
                    connectBtn.style.backgroundColor = '#3498db';
                    break;
                case 'connecting':
                    statusIndicator.classList.add('status-connecting');
                    connectBtn.disabled = true;
                    break;
                case 'error':
                    statusIndicator.classList.add('status-disconnected');
                    connectBtn.textContent = '连接服务器';
                    connectBtn.style.backgroundColor = '#3498db';
                    break;
            }
        }
        
        // 音量计类
        class SoundMeter {
            constructor(context) {
                this.context = context;
                this.instant = 0.0;
                this.slow = 0.0;
                this.script = this.context.createScriptProcessor(2048, 1, 1);
                const that = this;
                
                this.script.onaudioprocess = function(event) {
                    const input = event.inputBuffer.getChannelData(0);
                    let sum = 0.0;
                    
                    for (let i = 0; i < input.length; i++) {
                        sum += input[i] * input[i];
                    }
                    
                    that.instant = Math.sqrt(sum / input.length);
                    that.slow = 0.95 * that.slow + 0.05 * that.instant;
                };
            }
            
            connectToSource(stream, callback) {
                try {
                    this.mic = this.context.createMediaStreamSource(stream);
                    this.mic.connect(this.script);
                    this.script.connect(this.context.destination);
                    
                    if (typeof callback === 'function') {
                        callback(null);
                    }
                } catch (e) {
                    if (typeof callback === 'function') {
                        callback(e);
                    }
                }
            }
            
            stop() {
                if (this.mic) {
                    this.mic.disconnect();
                }
                this.script.disconnect();
            }
        }
        
        // 初始化应用
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
